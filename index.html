<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Air Canvas</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: white; 
            font-family: sans-serif; 
            overflow: hidden; 
        }
        
        /* Video ko background mein full screen karne ke liye */
        #video-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Aspect ratio maintain rakhta hai */
            transform: scaleX(-1); /* Mirror effect */
            z-index: 1;
        }

        /* Drawing canvas video ke upar rahega */
        #drawing_canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; /* Mouse clicks canvas ke piche ja sakein */
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            align-items: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status { font-weight: bold; color: #00f2ff; text-shadow: 0 0 5px #000; }
        button { cursor: pointer; border-radius: 20px; border: none; padding: 5px 15px; background: #ff4444; color: white; }
    </style>
</head>
<body>

    <div id="controls">
        <div id="mode-text" class="status">Starting Camera...</div>
        <input type="color" id="colorPicker" value="#00f2ff">
        <input type="range" id="sizeSlider" min="3" max="30" value="12">
        <button onclick="clearCanvas()">Clear</button>
    </div>

    <video id="video-full" autoplay playsinline></video>
    <canvas id="drawing_canvas"></canvas>
    
    <video id="hidden_video" style="display:none"></video>

    <script>
        const videoFull = document.getElementById('video-full');
        const videoHidden = document.getElementById('hidden_video');
        const canvasElement = document.getElementById('drawing_canvas');
        const ctx = canvasElement.getContext('2d');
        const modeText = document.getElementById('mode-text');
        const colorPicker = document.getElementById('colorPicker');
        const sizeSlider = document.getElementById('sizeSlider');

        let lastX = 0, lastY = 0;
        let smoothX = 0, smoothY = 0;
        let isDrawing = false;
        const smoothing = 0.3;

        function resize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function clearCanvas() {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        }

        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                modeText.innerText = "LOOKING FOR HAND...";
                isDrawing = false;
                return;
            }

            const landmarks = results.multiHandLandmarks[0];
            const x = (1 - landmarks[8].x) * canvasElement.width;
            const y = landmarks[8].y * canvasElement.height;

            smoothX += (x - smoothX) * smoothing;
            smoothY += (y - smoothY) * smoothing;

            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringUp = landmarks[16].y < landmarks[14].y;

            if (indexUp && !middleUp) {
                modeText.innerText = "DRAWING";
                if (isDrawing) {
                    ctx.beginPath();
                    ctx.lineCap = 'round';
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(smoothX, smoothY);
                    ctx.strokeStyle = colorPicker.value;
                    ctx.lineWidth = sizeSlider.value;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = colorPicker.value;
                    ctx.stroke();
                }
                lastX = smoothX; lastY = smoothY;
                isDrawing = true;
            } else if (indexUp && middleUp && ringUp) {
                modeText.innerText = "ERASING";
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(smoothX, smoothY, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                isDrawing = false;
            } else {
                modeText.innerText = "PAUSED";
                isDrawing = false;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoHidden, {
            onFrame: async () => {
                await hands.send({image: videoHidden});
                if (videoFull.srcObject !== videoHidden.srcObject) {
                    videoFull.srcObject = videoHidden.srcObject;
                }
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
