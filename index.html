<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Air Canvas - Smooth Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #080808; color: white; font-family: sans-serif; overflow: hidden; }
        #controls {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 12px 25px;
            border-radius: 50px; display: flex; gap: 15px; align-items: center;
            border: 1px solid #333; backdrop-filter: blur(5px);
        }
        canvas { position: absolute; top: 0; left: 0; }
        #video-container {
            position: absolute; bottom: 20px; right: 20px; width: 180px;
            border: 2px solid #00f2ff; border-radius: 12px; transform: scaleX(-1);
        }
        input[type="range"] { cursor: pointer; accent-color: #00f2ff; }
        .status { font-weight: bold; color: #00f2ff; min-width: 120px; text-align: center; }
    </style>
</head>
<body>

    <div id="controls">
        <div id="mode-text" class="status">Initializing...</div>
        <input type="color" id="colorPicker" value="#00f2ff">
        <input type="range" id="sizeSlider" min="3" max="25" value="10">
        <button onclick="clearCanvas()" style="background:#f00; border:none; color:white; padding:5px 15px; border-radius:15px; cursor:pointer;">Clear</button>
    </div>

    <video id="input_video" style="display:none"></video>
    <canvas id="drawing_canvas"></canvas>
    <video id="video-container" autoplay playsinline></video>

    <script>
        const videoElement = document.getElementById('input_video');
        const previewVideo = document.getElementById('video-container');
        const canvasElement = document.getElementById('drawing_canvas');
        const ctx = canvasElement.getContext('2d');
        const modeText = document.getElementById('mode-text');
        const colorPicker = document.getElementById('colorPicker');
        const sizeSlider = document.getElementById('sizeSlider');

        // Smoothing variables
        let lastX = 0, lastY = 0;
        let smoothX = 0, smoothY = 0;
        let isDrawing = false;
        const smoothingFactor = 0.35; // 0.1 (slow/smooth) to 1.0 (fast/jittery)

        function resize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function clearCanvas() {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        }

        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                modeText.innerText = "NO HAND";
                isDrawing = false;
                return;
            }

            const landmarks = results.multiHandLandmarks[0];
            const rawX = (1 - landmarks[8].x) * canvasElement.width;
            const rawY = landmarks[8].y * canvasElement.height;

            // Apply Exponential Smoothing
            smoothX = smoothX + (rawX - smoothX) * smoothingFactor;
            smoothY = smoothY + (rawY - smoothY) * smoothingFactor;

            // Gestures
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringUp = landmarks[16].y < landmarks[14].y;

            if (indexUp && !middleUp) {
                modeText.innerText = "DRAWING";
                if (isDrawing) {
                    ctx.beginPath();
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(smoothX, smoothY);
                    
                    ctx.strokeStyle = colorPicker.value;
                    ctx.lineWidth = sizeSlider.value;
                    
                    // Strong Neon Glow
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = colorPicker.value;
                    
                    ctx.stroke();
                }
                lastX = smoothX;
                lastY = smoothY;
                isDrawing = true;
            } 
            else if (indexUp && middleUp && ringUp) {
                modeText.innerText = "ERASING";
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(smoothX, smoothY, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                isDrawing = false;
            } else {
                modeText.innerText = "PAUSED";
                isDrawing = false;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1, // Medium for speed
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
                if (previewVideo.srcObject !== videoElement.srcObject) {
                    previewVideo.srcObject = videoElement.srcObject;
                }
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
