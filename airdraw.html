<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Air Canvas</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #controls {
            position: absolute;
            top: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            border: 2px solid #00f2ff;
            border-radius: 10px;
            transform: scaleX(-1); /* Mirror view */
        }
        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: transparent;
        }
        .status {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00f2ff;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div>Status: <span id="mode-text" class="status">Waiting...</span></div>
        <input type="color" id="colorPicker" value="#00f2ff">
        <input type="range" id="sizeSlider" min="2" max="20" value="8">
        <button onclick="clearCanvas()" style="background:none; border: 1px solid white; color:white; border-radius:5px; cursor:pointer; padding: 5px 10px;">Clear</button>
    </div>

    <video id="input_video" style="display:none"></video>
    <canvas id="drawing_canvas"></canvas>
    <video id="video-container" autoplay playsinline></video>

    <script>
        const videoElement = document.getElementById('input_video');
        const previewVideo = document.getElementById('video-container');
        const canvasElement = document.getElementById('drawing_canvas');
        const ctx = canvasElement.getContext('2d');
        const modeText = document.getElementById('mode-text');
        const colorPicker = document.getElementById('colorPicker');
        const sizeSlider = document.getElementById('sizeSlider');

        let lastX = 0;
        let lastY = 0;
        let isDrawing = false;

        // Initialize Canvas Size
        function resize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        window.addEventListener('resize', resize);
        resize();

        function clearCanvas() {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        }

        function onResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                modeText.innerText = "No Hand Detected";
                isDrawing = false;
                return;
            }

            const landmarks = results.multiHandLandmarks[0];
            
            // Mirror coordinates: (1 - x) because webcam is usually mirrored
            const x = (1 - landmarks[8].x) * canvasElement.width;
            const y = landmarks[8].y * canvasElement.height;

            // Gesture Logic
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringUp = landmarks[16].y < landmarks[14].y;
            const pinkyUp = landmarks[20].y < landmarks[18].y;

            // 1. One Finger (Index) = DRAW
            if (indexUp && !middleUp && !ringUp) {
                modeText.innerText = "Drawing";
                modeText.style.color = "#00f2ff";
                
                if (isDrawing) {
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    
                    // Neon Effect
                    ctx.strokeStyle = colorPicker.value;
                    ctx.lineWidth = sizeSlider.value;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = colorPicker.value;
                    
                    ctx.stroke();
                }
                lastX = x;
                lastY = y;
                isDrawing = true;
            } 
            // 2. Open Palm = ERASE
            else if (indexUp && middleUp && ringUp) {
                modeText.innerText = "Erasing";
                modeText.style.color = "#ff0055";
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                isDrawing = false;
            }
            // 3. Closed Fist = PAUSE
            else if (!indexUp && !middleUp && !ringUp) {
                modeText.innerText = "Paused";
                modeText.style.color = "#ffff00";
                isDrawing = false;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
                // Sync the preview video
                if (previewVideo.srcObject !== videoElement.srcObject) {
                    previewVideo.srcObject = videoElement.srcObject;
                }
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
